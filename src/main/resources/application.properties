server.port=8090
server.shutdown=graceful
spring.main.banner-mode=off
logging.config=classpath:logging/logback-json.xml
bank.base-url=${BANK_BASE_URL:http://localhost:8080}
bank.connect-timeout-ms=${BANK_CONNECT_TIMEOUT_MS:2000}
bank.read-timeout-ms=${BANK_READ_TIMEOUT_MS:3000}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=payment-gateway
spring.jackson.default-property-inclusion=non_null
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.parser.strict-duplicate-detection=true
