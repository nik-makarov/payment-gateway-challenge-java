name: Build and publish

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@b9bee63ef481cc545e4517ec730544a4d8b1dfa0 # v6.4.0
        with:
          cache-provider: basic

      - name: Build JAR and run tests
        run: ./gradlew --no-daemon build

      - name: Upload JAR and test reports
        id: reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-results
          path: |
            build/libs/payment-gateway.jar
            build/reports/tests/test/
            build/reports/jacoco/test/
            build/test-results/test/
          retention-days: 14

      - name: Link reports in the run summary
        if: ${{ always() && steps.reports.outputs.artifact-url != '' }}
        env:
          REPORTS_URL: ${{ steps.reports.outputs.artifact-url }}
        run: |
          printf '\n[Download JAR, test results and full coverage reports](%s)\n' \
            "$REPORTS_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Build container image
        run: docker build --tag payment-gateway:ci .

      - name: Check container startup
        run: |
          trap 'docker logs payment-gateway-ci; docker rm --force payment-gateway-ci' EXIT
          docker run --detach --name payment-gateway-ci \
            --publish 127.0.0.1:8090:8090 payment-gateway:ci
          # Retry connection resets and empty replies while Java starts listening.
          curl --fail --silent --show-error --retry 20 --retry-all-errors \
            --retry-delay 1 --retry-max-time 30 --max-time 2 \
            http://127.0.0.1:8090/actuator/health/readiness

  publish:
    name: Publish container image
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          builder: default
          push: true
          provenance: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
